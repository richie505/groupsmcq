name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["tools/generated/**", "**.md"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch to build
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build assets (PYQs + generated notes MCQs)
        run: python3 tools/build_assets.py
      - name: Tests (every question loads; every screen renders; quiz and mock click-through)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Release version
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: ver
        run: |
          v=$(sed -n 's/.*packageVersion = "\(.*\)".*/\1/p' desktop/build.gradle.kts)
          echo "v=v$v" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "APPSC-MCQ-90-$v.apk"
      - name: Publish to the GitHub release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: APPSC MCQ 90 ${{ steps.ver.outputs.v }}
          files: APPSC-MCQ-90-*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: appsc-mcq-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
