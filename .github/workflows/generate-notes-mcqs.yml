name: Generate notes MCQs (OpenAI)
# Run from the Actions tab: "Generate notes MCQs (OpenAI)" → Run workflow.

# Needs the repository secret OPENAI_API_KEY (Settings → Secrets and variables → Actions).
# Resumable: finished chunks are committed under tools/generated/, so re-running continues where it stopped.
on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model id
        default: gpt-5.6-luna
      days:
        description: Only the sections of these plan days, e.g. 1-10 (blank = all)
        default: ""
      book:
        description: Only this book 1-6 (blank = all)
        default: ""
      limit:
        description: Stop after this many chunks (0 = no limit; use 3 for a pilot)
        default: "0"
      concurrency:
        description: Parallel API calls
        default: "6"
      time_budget:
        description: Minutes before it stops starting new chunks (job limit is 360)
        default: "320"

permissions:
  contents: write

concurrency:
  group: generate-notes-mcqs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          args="--model ${{ inputs.model }} --concurrency ${{ inputs.concurrency }} --time-budget ${{ inputs.time_budget }} --limit ${{ inputs.limit }}"
          [ -n "${{ inputs.days }}" ] && args="$args --days ${{ inputs.days }}"
          [ -n "${{ inputs.book }}" ] && args="$args --book ${{ inputs.book }}"
          python3 tools/generate_notes_mcqs.py $args
      - name: Rebuild assets
        if: always()
        run: python3 tools/build_assets.py
      - name: Commit generated MCQs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/generated app/src/main/assets
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          n=$(python3 -c "import json;print(json.load(open('app/src/main/assets/stats.json'))['notes_mcqs'])")
          git commit -m "Generate notes MCQs ($n in the bank)"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*5)); done

  build:
    needs: generate
    if: always()
    uses: ./.github/workflows/build-apk.yml
    with:
      ref: ${{ github.ref_name }}
