name: Build Windows app

on:
  push:
    branches: ["**"]
    paths-ignore: ["tools/generated/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The question bank (app/src/main/assets) is committed, so the Windows build uses it as is.
      - name: Tests (question bank loads; app starts, switches tabs, opens a quiz)
        run: ./gradlew --no-daemon -PskipAndroid :desktop:test
      - name: Build installer (.exe), MSI and portable app
        run: ./gradlew --no-daemon -PskipAndroid :desktop:packageExe :desktop:packageMsi :desktop:createDistributable
      - name: Zip the portable app
        shell: pwsh
        run: Compress-Archive -Path "desktop/build/compose/binaries/main/app/APPSC MCQ 90" -DestinationPath "APPSC-MCQ-90-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: appsc-mcq-windows
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
            APPSC-MCQ-90-portable.zip
          if-no-files-found: error
      # Builds of the main branch publish to the release of the current version (v<packageVersion>),
      # replacing that version's files, so the Releases page always has the latest build.
      - name: Release version
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: ver
        shell: bash
        run: echo "v=v$(sed -n 's/.*packageVersion = "\(.*\)".*/\1/p' desktop/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Publish to the GitHub release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: APPSC MCQ 90 ${{ steps.ver.outputs.v }}
          body: |
            **Windows:** `APPSC.MCQ.90-<version>.exe` is the installer (Start menu + desktop shortcut, no admin needed). `APPSC-MCQ-90-portable.zip` runs without installing: unzip it and open `APPSC MCQ 90.exe`.
            **Android:** `APPSC-MCQ-90-<version>.apk` installs over the previous version and keeps your progress.
          files: |
            desktop/build/compose/binaries/main/exe/*.exe
            APPSC-MCQ-90-portable.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-reports
          path: desktop/build/reports/tests/
